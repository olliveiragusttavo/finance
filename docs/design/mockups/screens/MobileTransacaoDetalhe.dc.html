<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Detalhe da transação — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.light{--bg:#F4F5F2;--surface:#FFFFFF;--line:#DDE1DC;--line2:#EEF0EC;--ink:#1B1F1D;--ink2:#3D4541;--muted:#5A625E;--accent:#1F5F8B;--on-accent:#FFFFFF;--soft:#E6EEF4;--soft-ink:#163F5C;--in:#1F5F8B;--out:#A04A12;--track:#EEF0EC;--danger:#9B2C1F}
.dark{--bg:#111413;--surface:#1A1E1C;--line:#2E3431;--line2:#242926;--ink:#E7EAE7;--ink2:#C3C9C5;--muted:#9AA29E;--accent:#6AAAD8;--on-accent:#0B1A24;--soft:#1D3040;--soft-ink:#B5D7F0;--in:#7DB8E2;--out:#E89A63;--track:#2A302D;--danger:#F08A7A}
a{color:var(--accent);text-decoration:none}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;cursor:pointer}
.ph{width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px 8px 4px;background:var(--surface);min-height:66px;box-sizing:border-box}
.hl{display:flex;align-items:center;gap:2px}
.ttl2{margin:0;font-size:17px;font-weight:600}
.ib{width:44px;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px}
.bd{flex-grow:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:14px}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);min-height:46px;box-sizing:border-box;font-size:14px}
.it:last-child{border-bottom:0}
.k{color:var(--muted)}
.v{text-align:right}
.sm{font-size:12px;color:var(--muted)}
.sec{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.out{color:var(--out)}
.pill{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--soft-ink)}
.thumb{width:96px;height:84px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--muted)}
.foot{display:grid;grid-template-columns:2fr 1fr;gap:10px;padding:12px 16px 20px;background:var(--surface);border-top:1px solid var(--line)}
.bs{display:flex;align-items:center;justify-content:center;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px}
.dl{color:var(--danger)}
</style>
</helmet>
<div class="ph {{themeClass}}">
<header class="hdr">
<div class="hl"><a href="MobileTransacoes.dc.html" class="back" aria-label="Voltar para transações">‹</a><h1 class="ttl2">Detalhe</h1></div>
<button type="button" class="ib" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
</header>
<div class="bd">
<div class="hero"><span class="n out" style="font-size: 34px; font-weight: 600">−R$ 400,00</span><span style="font-size: 17px; font-weight: 500">Notebook</span><span class="pill n">Parcela 3 de 12</span></div>
<div class="list">
<div class="it"><span class="k">Tipo</span><span class="v">Despesa</span></div>
<div class="it"><span class="k">Categoria</span><span class="v">Compras › Eletrônicos</span></div>
<div class="it"><span class="k">Cartão</span><span class="v">Nubank Roxinho</span></div>
<div class="it"><span class="k">Fatura</span><span class="v">nov/2026 · vence 10/11</span></div>
<div class="it"><span class="k">Data da compra</span><span class="v n">08/10/2026</span></div>
<div class="it"><span class="k">Recorrência</span><span class="v">Parcelado · 12x · total R$ 4.800,00</span></div>
<div class="it"><span class="k">Tags</span><span class="v sm">nenhuma</span></div>
</div>
<h2 class="sec">Anexos</h2>
<div style="display: flex; gap: 10px">
<div class="thumb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>nota-fiscal.pdf</div>
<div class="thumb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-8 7"/></svg>recibo.jpg</div>
<button type="button" class="thumb" style="border-style: dashed; color: var(--accent)" aria-label="Adicionar anexo"><span style="font-size: 22px">+</span>Adicionar</button>
</div>
</div>
<div class="foot"><button type="button" class="bs">Editar</button><a href="MobileEscopo.dc.html" class="bs dl">Excluir</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const dark = s.dark ?? (this.props.dark ?? true);
return {
themeClass: dark ? 'dark' : 'light',
themeLabel: dark ? 'Usar tema claro' : 'Usar tema escuro',
toggleTheme: () => this.setState({ dark: !dark })
};
}
}
</script>
</body>
</html>
