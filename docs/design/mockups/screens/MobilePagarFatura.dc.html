<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pagar fatura — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.light{--bg:#F4F5F2;--surface:#FFFFFF;--line:#DDE1DC;--line2:#EEF0EC;--ink:#1B1F1D;--ink2:#3D4541;--muted:#5A625E;--accent:#1F5F8B;--on-accent:#FFFFFF;--soft:#E6EEF4;--soft-ink:#163F5C;--warn-bg:#FFF1D6;--warn-ink:#5C3D00}
.dark{--bg:#111413;--surface:#1A1E1C;--line:#2E3431;--line2:#242926;--ink:#E7EAE7;--ink2:#C3C9C5;--muted:#9AA29E;--accent:#6AAAD8;--on-accent:#0B1A24;--soft:#1D3040;--soft-ink:#B5D7F0;--warn-bg:#3A2C10;--warn-ink:#F2D38F}
a{color:var(--accent);text-decoration:none}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;cursor:pointer}
.ph{width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px 8px 4px;background:var(--surface);min-height:66px;box-sizing:border-box}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 16px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line2);min-height:48px;box-sizing:border-box;font-size:15px;background:none;width:100%;text-align:left}
.it:last-child{border-bottom:0}
.k{color:var(--muted)}
.sm{font-size:12px;color:var(--muted)}
.pill{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--warn-bg);color:var(--warn-ink)}
.note{background:var(--soft);color:var(--soft-ink);border-radius:10px;padding:12px;font-size:14px}
.bp{display:flex;align-items:center;justify-content:center;height:50px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600}
</style>
</helmet>
<div class="ph {{themeClass}}">
<header class="hdr"><div style="display: flex; align-items: center"><a href="MobileFatura.dc.html" class="back" aria-label="Voltar">‹</a><span style="font-size: 17px; font-weight: 600">Nubank Roxinho</span></div><button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button></header>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px"><span class="pill">Em aberto</span><span class="n" style="font-size: 32px; font-weight: 600">R$ 2.449,75</span><span class="sm">Fatura out/2026 · vence 10/10</span></div>
<div class="scrim" aria-hidden="true"></div>
<section class="sheet" role="dialog" aria-label="Pagar fatura">
<div class="grab" aria-hidden="true"></div>
<div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 18px; font-weight: 600">Pagar fatura de out/2026</h2><span class="sm">Nubank Roxinho</span></div>
<div style="display: flex; flex-direction: column; align-items: center; padding: 6px 0"><span class="sm">Valor a pagar</span><span class="n" style="font-size: 30px; font-weight: 600">R$ 2.449,75</span></div>
<div class="list">
<button type="button" class="it"><span class="k">Pagar com</span><span>Nubank ›</span></button>
<button type="button" class="it"><span class="k">Data do pagamento</span><span class="n">10/10/2026 ›</span></button>
</div>
<div class="note n">A fatura vira <b>Paga</b> no extrato de out/2026 do Nubank. Saldo consolidado da conta: R$ 4.320,15 → <b>R$ 1.870,40</b>.</div>
<a href="MobileFatura.dc.html" class="bp">Confirmar pagamento</a>
<a href="#" style="text-align: center; font-size: 14px; padding: 6px">Fazer pagamento parcial</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const dark = s.dark ?? (this.props.dark ?? false);
return {
themeClass: dark ? 'dark' : 'light',
themeLabel: dark ? 'Usar tema claro' : 'Usar tema escuro',
toggleTheme: () => this.setState({ dark: !dark })
};
}
}
</script>
</body>
</html>
