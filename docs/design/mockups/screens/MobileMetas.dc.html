<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Metas — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.light{--bg:#F4F5F2;--surface:#FFFFFF;--line:#DDE1DC;--line2:#EEF0EC;--ink:#1B1F1D;--ink2:#3D4541;--muted:#5A625E;--accent:#1F5F8B;--on-accent:#FFFFFF;--soft:#E6EEF4;--soft-ink:#163F5C;--track:#EEF0EC}
.dark{--bg:#111413;--surface:#1A1E1C;--line:#2E3431;--line2:#242926;--ink:#E7EAE7;--ink2:#C3C9C5;--muted:#9AA29E;--accent:#6AAAD8;--on-accent:#0B1A24;--soft:#1D3040;--soft-ink:#B5D7F0;--track:#2A302D}
a{color:var(--accent);text-decoration:none}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;cursor:pointer}
.ph{width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px 8px 4px;background:var(--surface);min-height:66px;box-sizing:border-box;border-bottom:1px solid var(--line)}
.hl{display:flex;align-items:center;gap:2px}
.ttl{margin:0;font-size:20px;font-weight:600}
.acts{display:flex;gap:8px}
.ib{width:44px;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px}
.bd{flex-grow:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sm{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--track);border-radius:4px}
.bar>div{height:100%;background:var(--accent);border-radius:4px}
.tab{height:72px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:11px}
.tab a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)}
.tab a.on{color:var(--accent);font-weight:600}
</style>
</helmet>
<div class="ph {{themeClass}}">
<header class="hdr">
<div class="hl"><a href="MobileMais.dc.html" class="back" aria-label="Voltar para Mais">‹</a><h1 class="ttl">Metas</h1></div>
<div class="acts"><button type="button" class="ib" aria-label="Nova meta">+</button><button type="button" class="ib" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button></div>
</header>
<div class="bd">
<a href="#" class="card"><span class="row"><span style="font-size: 16px; font-weight: 600">Reserva de emergência</span><span class="n" style="font-weight: 600">62%</span></span><span class="bar"><div style="width: 62%"></div></span><span class="row"><span class="n" style="font-size: 14px">R$ 18.600,00 <span class="sm">de R$ 30.000,00</span></span><span class="sm">sem data-alvo</span></span></a>
<a href="#" class="card"><span class="row"><span style="font-size: 16px; font-weight: 600">Viagem Floripa</span><span class="n" style="font-weight: 600">35%</span></span><span class="bar"><div style="width: 35%"></div></span><span class="row"><span class="n" style="font-size: 14px">R$ 1.400,00 <span class="sm">de R$ 4.000,00</span></span><span class="sm n">até 15/01/2027</span></span><span class="sm n" style="padding-top: 8px; border-top: 1px solid var(--line2)">Para chegar lá: ≈ R$ 743,00 por mês</span></a>
<span class="sm" style="padding: 0 4px">O progresso soma as transações vinculadas a cada meta.</span>
</div>
<nav aria-label="Navegação" class="tab">
<a href="MobileInicio.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
<a href="MobileTransacoes.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Transações</a>
<a href="MobileContas.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>Contas</a>
<a href="MobileCartoes.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Cartões</a>
<a href="MobileMais.dc.html" class="on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mais</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const dark = s.dark ?? (this.props.dark ?? true);
return {
themeClass: dark ? 'dark' : 'light',
themeLabel: dark ? 'Usar tema claro' : 'Usar tema escuro',
toggleTheme: () => this.setState({ dark: !dark })
};
}
}
</script>
</body>
</html>
