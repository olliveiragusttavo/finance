<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Contas e cartões — celular</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.light{--bg:#F4F5F2;--surface:#FFFFFF;--surface2:#FAFAF8;--line:#DDE1DC;--line2:#EEF0EC;--ink:#1B1F1D;--ink2:#3D4541;--muted:#5A625E;--accent:#1F5F8B;--on-accent:#FFFFFF;--soft:#E6EEF4;--soft-ink:#163F5C;--in:#1F5F8B;--out:#A04A12;--warn-bg:#FFF1D6;--warn-ink:#5C3D00;--ok-bg:#E2F1E8;--ok-ink:#1E5A3F;--track:#EEF0EC;--danger:#9B2C1F}
.dark{--bg:#111413;--surface:#1A1E1C;--surface2:#151917;--line:#2E3431;--line2:#242926;--ink:#E7EAE7;--ink2:#C3C9C5;--muted:#9AA29E;--accent:#6AAAD8;--on-accent:#0B1A24;--soft:#1D3040;--soft-ink:#B5D7F0;--in:#7DB8E2;--out:#E89A63;--warn-bg:#3A2C10;--warn-ink:#F2D38F;--ok-bg:#16302A;--ok-ink:#8FD9B4;--track:#2A302D;--danger:#F08A7A}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--soft-ink)}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--bg); font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); display: flex; flex-direction: column">
<header style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 10px; background: var(--surface)">
<h1 style="margin: 0; font-size: 20px; font-weight: 600">Contas</h1>
<div style="display: flex; gap: 8px">
<button type="button" aria-label="Adicionar conta" style="width: 44px; height: 44px; border: 1px solid var(--line); background: var(--bg); border-radius: 50%; font-size: 20px">+</button>
<button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; border: 1px solid var(--line); background: var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
</div>
</header>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 6px; background: var(--surface); border-bottom: 1px solid var(--line)">
<button type="button" aria-label="Mês anterior" onClick="{{prevMonth}}" style="width: 48px; height: 44px; border: 0; background: none; font-size: 20px">‹</button>
<button type="button" style="border: 0; background: none; display: flex; flex-direction: column; align-items: center; padding: 4px 12px"><span style="font-size: 11px; color: var(--muted)">Mês de referência</span><span style="font-size: 15px; font-weight: 600">{{monthLabel}}</span></button>
<button type="button" aria-label="Próximo mês" onClick="{{nextMonth}}" style="width: 48px; height: 44px; border: 0; background: none; font-size: 20px">›</button>
</div>

<div style="flex-grow: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px">
<section style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--muted)"><span>Conta</span><span>saldo no fim do mês</span></div>
<div style="background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden">
<a href="MobileExtrato.dc.html" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; color: var(--ink); border-bottom: 1px solid var(--line2)"><span style="display: flex; flex-direction: column"><span style="font-size: 15px">Nubank</span><span style="font-size: 12px; color: var(--muted)">Corrente</span></span><span style="display: flex; align-items: center; gap: 10px"><span style="display: flex; flex-direction: column; align-items: flex-end"><span class="n" style="font-size: 15px; font-weight: 600">R$ 4.320,15</span><span class="n" style="font-size: 12px; color: var(--muted)">previsto R$ 1.870,40</span></span><span aria-hidden="true" style="color: var(--muted)">›</span></span></a>
<a href="#" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; color: var(--ink); border-bottom: 1px solid var(--line2)"><span style="display: flex; flex-direction: column"><span style="font-size: 15px">Itaú</span><span style="font-size: 12px; color: var(--muted)">Corrente</span></span><span style="display: flex; align-items: center; gap: 10px"><span style="display: flex; flex-direction: column; align-items: flex-end"><span class="n" style="font-size: 15px; font-weight: 600">R$ 1.250,00</span><span class="n" style="font-size: 12px; color: var(--muted)">previsto R$ 1.250,00</span></span><span aria-hidden="true" style="color: var(--muted)">›</span></span></a>
<a href="#" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; color: var(--ink); border-bottom: 1px solid var(--line2)"><span style="display: flex; flex-direction: column"><span style="font-size: 15px">Tesouro Direto</span><span style="font-size: 12px; color: var(--muted)">Investimentos</span></span><span style="display: flex; align-items: center; gap: 10px"><span style="display: flex; flex-direction: column; align-items: flex-end"><span class="n" style="font-size: 15px; font-weight: 600">R$ 18.400,00</span><span class="n" style="font-size: 12px; color: var(--muted)">previsto R$ 18.900,00</span></span><span aria-hidden="true" style="color: var(--muted)">›</span></span></a>
<a href="#" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; color: var(--muted)"><span style="display: flex; flex-direction: column"><span style="font-size: 15px">Wise (USD)</span><span style="font-size: 12px">Fora do total</span></span><span style="display: flex; align-items: center; gap: 10px"><span class="n" style="font-size: 15px">R$ 2.100,00</span><span aria-hidden="true">›</span></span></a>
</div>
<div style="display: flex; justify-content: space-between; padding: 0 4px; font-size: 13px"><span style="color: var(--muted)">Total consolidado</span><span class="n" style="font-weight: 600">R$ 23.970,15</span></div>
</section>

</div>

<nav aria-label="Navegação" style="height: 72px; flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); font-size: 11px">
<a href="MobileInicio.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
<a href="MobileTransacoes.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Transações</a>
<a href="MobileContas.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--accent); font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>Contas</a>
<a href="MobileCartoes.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Cartões</a>
<a href="MobileMais.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mais</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const M = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const base = 2026 * 12 + 9;
const idx = s.idx ?? base;
const dark = s.dark ?? (this.props.dark ?? true);
return {
themeClass: dark ? 'dark' : 'light',
themeLabel: dark ? 'Usar tema claro' : 'Usar tema escuro',
toggleTheme: () => this.setState({ dark: !dark }),
monthLabel: M[idx % 12] + ' de ' + Math.floor(idx / 12),
prevMonth: () => this.setState({ idx: idx - 1 }),
nextMonth: () => this.setState({ idx: idx + 1 })
};
}
}
</script>
</body>
</html>
