<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Recebendo dados — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.light{--bg:#F4F5F2;--surface:#FFFFFF;--line:#DDE1DC;--ink:#1B1F1D;--muted:#5A625E;--accent:#1F5F8B;--track:#E2E6E1}
.dark{--bg:#111413;--surface:#1A1E1C;--line:#2E3431;--ink:#E7EAE7;--muted:#9AA29E;--accent:#6AAAD8;--track:#2A302D}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.ph{width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sm{font-size:14px;color:var(--muted)}
.bar{height:8px;background:var(--track);border-radius:4px;width:100%}
.bar>div{height:100%;background:var(--accent);border-radius:4px}
</style>
</helmet>
<div class="ph {{themeClass}}">
<button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true" style="color: var(--accent)"><rect x="2" y="5" width="12" height="9" rx="1"/><path d="M1 17h14"/><rect x="17" y="7" width="6" height="11" rx="1"/><path d="M14 10h3"/></svg>
<h1 style="margin: 0; font-size: 22px; font-weight: 600">Recebendo dados do Notebook (Linux)</h1>
<div class="bar" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso"><div style="width: 64%"></div></div>
<span class="sm n">64% · [n] de [total] registros</span>
<span class="sm">Mantenha os dois apps abertos e na mesma rede Wi-Fi. Pode levar alguns minutos.</span>
<button type="button" style="border: 0; background: none; color: var(--accent); font-size: 15px; padding: 10px; margin-top: 24px">Cancelar</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const dark = s.dark ?? (this.props.dark ?? true);
return {
themeClass: dark ? 'dark' : 'light',
themeLabel: dark ? 'Usar tema claro' : 'Usar tema escuro',
toggleTheme: () => this.setState({ dark: !dark })
};
}
}
</script>
</body>
</html>
