<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ajustes — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.light{--bg:#F4F5F2;--surface:#FFFFFF;--line:#DDE1DC;--line2:#EEF0EC;--ink:#1B1F1D;--ink2:#3D4541;--muted:#5A625E;--accent:#1F5F8B;--track:#D5DAD4;--seg:#E9ECE8}
.dark{--bg:#111413;--surface:#1A1E1C;--line:#2E3431;--line2:#242926;--ink:#E7EAE7;--ink2:#C3C9C5;--muted:#9AA29E;--accent:#6AAAD8;--track:#3A413D;--seg:#262B28}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.ph{width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:2px;padding:10px 12px 8px 4px;background:var(--surface);min-height:66px;box-sizing:border-box;border-bottom:1px solid var(--line)}
.ttl{margin:0;font-size:20px;font-weight:600}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px}
.bd{flex-grow:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sec{margin:6px 4px 0;font-size:13px;font-weight:600;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);color:var(--ink);min-height:52px;box-sizing:border-box;font-size:15px}
.it:last-child{border-bottom:0}
.st{display:flex;flex-direction:column;min-width:0}
.sm{font-size:12px;color:var(--muted)}
.chev{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--seg);border-radius:10px;padding:3px;font-size:13px;width:100%}
.seg button{border:0;background:none;padding:8px 0;min-height:38px;color:var(--ink2)}
.seg button.on{background:var(--surface);border-radius:8px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.2);color:var(--ink)}
.sw{width:48px;height:30px;border:0;border-radius:15px;background:var(--track);position:relative;flex-shrink:0;padding:0}
.sw.on{background:var(--accent)}
.sw i{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#FFFFFF}
.sw.on i{left:22px}
.tab{height:72px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:11px}
.tab a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)}
.tab a.on{color:var(--accent);font-weight:600}
</style>
</helmet>
<div class="ph {{themeClass}}">
<header class="hdr"><a href="MobileMais.dc.html" class="back" aria-label="Voltar para Mais">‹</a><h1 class="ttl">Ajustes</h1></header>
<div class="bd">
<h2 class="sec">Aparência</h2>
<div class="list"><div class="it" style="flex-direction: column; align-items: stretch; gap: 8px"><span>Tema</span><div class="seg" role="group" aria-label="Tema"><button type="button" class="{{sysClass}}" onClick="{{setSystem}}">Sistema</button><button type="button" class="{{lightClass}}" onClick="{{setLight}}">Claro</button><button type="button" class="{{darkClass}}" onClick="{{setDark}}">Escuro</button></div></div></div>
<h2 class="sec">Segurança</h2>
<div class="list"><div class="it"><span class="st"><span>Bloquear com biometria</span><span class="sm">Pede Face ID ao abrir o app</span></span><button type="button" class="sw on" role="switch" aria-checked="true" aria-label="Bloquear com biometria"><i></i></button></div></div>
<h2 class="sec">Perfil</h2>
<div class="list"><a href="#" class="it"><span>Perfil atual</span><span class="sm">Gustavo <span class="chev">›</span></span></a><a href="#" class="it"><span>Moeda</span><span class="sm">BRL <span class="chev">›</span></span></a></div>
<h2 class="sec">Cópia dos dados</h2>
<div class="list"><a href="#" class="it"><span class="st"><span>Exportar cópia do banco</span><span class="sm">Não há backup em nuvem · última: [data]</span></span><span class="chev">›</span></a><a href="#" class="it"><span>Lembrete de exportação</span><span class="sm">Mensal <span class="chev">›</span></span></a></div>
</div>
<nav aria-label="Navegação" class="tab">
<a href="MobileInicio.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
<a href="MobileTransacoes.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Transações</a>
<a href="MobileContas.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>Contas</a>
<a href="MobileCartoes.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Cartões</a>
<a href="MobileMais.dc.html" class="on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mais</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const mode = s.mode ?? 'system';
const dark = mode === 'dark' || (mode === 'system' && (this.props.dark ?? false));
return {
themeClass: dark ? 'dark' : 'light',
sysClass: mode === 'system' ? 'on' : '',
lightClass: mode === 'light' ? 'on' : '',
darkClass: mode === 'dark' ? 'on' : '',
setSystem: () => this.setState({ mode: 'system' }),
setLight: () => this.setState({ mode: 'light' }),
setDark: () => this.setState({ mode: 'dark' })
};
}
}
</script>
</body>
</html>
