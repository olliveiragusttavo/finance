<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lançamento rápido — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.light{--bg:#F4F5F2;--surface:#FFFFFF;--surface2:#FAFAF8;--line:#DDE1DC;--line2:#EEF0EC;--ink:#1B1F1D;--ink2:#3D4541;--muted:#5A625E;--accent:#1F5F8B;--on-accent:#FFFFFF;--soft:#E6EEF4;--soft-ink:#163F5C;--in:#1F5F8B;--out:#A04A12;--track:#EEF0EC;--seg:#E9ECE8}
.dark{--bg:#111413;--surface:#1A1E1C;--surface2:#151917;--line:#2E3431;--line2:#242926;--ink:#E7EAE7;--ink2:#C3C9C5;--muted:#9AA29E;--accent:#6AAAD8;--on-accent:#0B1A24;--soft:#1D3040;--soft-ink:#B5D7F0;--in:#7DB8E2;--out:#E89A63;--track:#2A302D;--seg:#262B28}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--soft-ink)}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); display: flex; flex-direction: column">
<header style="display: flex; justify-content: space-between; align-items: center; padding: 12px 8px 4px">
<a href="MobileInicio.dc.html" style="padding: 12px; font-size: 15px">Cancelar</a>
<span style="font-size: 15px; font-weight: 600">Novo lançamento</span>
<button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; margin-right: 8px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
</header>

<div role="group" aria-label="Tipo" style="margin: 4px 16px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--seg); border-radius: 10px; padding: 3px; font-size: 13px">
<button type="button" style="border: 0; background: none; padding: 9px 0; color: var(--ink2); min-height: 40px">Receita</button>
<button type="button" aria-pressed="true" style="border: 0; background: var(--surface); border-radius: 8px; padding: 9px 0; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.2); min-height: 40px">Despesa</button>
<button type="button" style="border: 0; background: none; padding: 9px 0; color: var(--ink2); min-height: 40px">Transf.</button>
<button type="button" style="border: 0; background: none; padding: 9px 0; color: var(--ink2); min-height: 40px">Invest.</button>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px 16px 10px">
<span class="n" style="font-size: 40px; font-weight: 600; color: var(--out)">−R$ 487,32</span>
<button type="button" aria-label="Inverter sinal (estorno)" style="border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 44px; height: 44px; font-size: 16px">±</button>
</div>

<div style="display: flex; flex-direction: column; border-top: 1px solid var(--line2); font-size: 15px">
<button type="button" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line2); background: none; text-align: left; min-height: 48px"><span style="color: var(--muted)">Onde</span><span style="font-weight: 500">Cartão Nubank Roxinho ›</span></button>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line2); background: var(--soft)">
<span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: var(--soft-ink)">Fatura sugerida</span><span style="font-weight: 600">nov/2026 · vence 10/11</span><span style="font-size: 12px; color: var(--soft-ink)">Compra após o fechamento de 03/10</span></span>
<button type="button" style="border: 1px solid var(--accent); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--accent); min-height: 40px">Trocar</button>
</div>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line2); background: none; text-align: left; min-height: 48px"><span style="color: var(--muted)">Categoria</span><span style="font-weight: 500">Alimentação › Mercado ›</span></button>
<div style="display: flex; gap: 6px; padding: 8px 16px 12px; border-bottom: 1px solid var(--line2); overflow: hidden; font-size: 12px">
<span style="border: 1px solid var(--accent); background: var(--soft); color: var(--soft-ink); border-radius: 999px; padding: 5px 10px; white-space: nowrap">Mercado</span>
<span style="border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; white-space: nowrap">Restaurantes</span>
<span style="border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; white-space: nowrap">Combustível</span>
<span style="border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; white-space: nowrap">Delivery</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line2); min-height: 48px; box-sizing: border-box"><span style="color: var(--muted)">Data</span><span>Hoje, 06/10</span></div>
<label style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line2); min-height: 48px; box-sizing: border-box"><span style="color: var(--muted)">Nome</span><input type="text" value="Supermercado Zona Sul" style="border: 0; text-align: right; outline: 0; width: 200px; background: none"></label>
<a href="MobileParcelar.dc.html" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; color: var(--accent); min-height: 48px; box-sizing: border-box"><span>Repetir ou parcelar</span><span>›</span></a>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border: 0; border-top: 1px solid var(--line2); background: none; color: var(--accent); min-height: 48px"><span>Mais detalhes · tags, anexo, meta…</span><span>▾</span></button>
</div>

<div style="margin-top: auto; padding: 8px 12px 16px; background: var(--bg); display: flex; flex-direction: column; gap: 8px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button type="button" class="n" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 20px">1</button>
<button type="button" class="n" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 20px">2</button>
<button type="button" class="n" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 20px">3</button>
<button type="button" class="n" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 20px">4</button>
<button type="button" class="n" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 20px">5</button>
<button type="button" class="n" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 20px">6</button>
<button type="button" class="n" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 20px">7</button>
<button type="button" class="n" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 20px">8</button>
<button type="button" class="n" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 20px">9</button>
<button type="button" class="n" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 20px">00</button>
<button type="button" class="n" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 20px">0</button>
<button type="button" aria-label="Apagar" style="height: 46px; border: 0; border-radius: 8px; background: var(--surface); font-size: 18px">⌫</button>
</div>
<a href="MobileInicio.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 600">Salvar</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const dark = s.dark ?? (this.props.dark ?? true);
return {
themeClass: dark ? 'dark' : 'light',
themeLabel: dark ? 'Usar tema claro' : 'Usar tema escuro',
toggleTheme: () => this.setState({ dark: !dark })
};
}
}
</script>
</body>
</html>
