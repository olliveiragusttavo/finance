<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Primeiro uso — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.light{--bg:#F4F5F2;--surface:#FFFFFF;--line:#DDE1DC;--line2:#EEF0EC;--ink:#1B1F1D;--ink2:#3D4541;--muted:#5A625E;--accent:#1F5F8B;--on-accent:#FFFFFF;--seg:#E9ECE8}
.dark{--bg:#111413;--surface:#1A1E1C;--line:#2E3431;--line2:#242926;--ink:#E7EAE7;--ink2:#C3C9C5;--muted:#9AA29E;--accent:#6AAAD8;--on-accent:#0B1A24;--seg:#262B28}
a{color:var(--accent);text-decoration:none}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.ph{width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;padding:56px 20px 24px;gap:14px}
.sm{font-size:13px;color:var(--muted)}
.sec{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);min-height:50px;box-sizing:border-box;font-size:15px}
.it:last-child{border-bottom:0}
.it input{border:0;background:none;text-align:right;outline:0;width:170px}
.k{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--seg);border-radius:10px;padding:3px;font-size:13px;width:180px}
.seg button{border:0;background:none;padding:6px 0;min-height:34px;color:var(--ink2)}
.seg button.on{background:var(--surface);border-radius:8px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.2);color:var(--ink)}
.bp{display:flex;align-items:center;justify-content:center;height:50px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600}
.bs{display:flex;align-items:center;justify-content:center;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:15px}
</style>
</helmet>
<div class="ph {{themeClass}}">
<button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 26px; font-weight: 600">Vamos começar</h1><span class="sm">Seus dados ficam só neste aparelho e nos dispositivos que você parear.</span></div>
<h2 class="sec">Perfil</h2>
<div class="list">
<label class="it"><span class="k">Nome</span><input type="text" placeholder="Ex.: Pessoal" maxlength="45"></label>
<div class="it"><span class="k">Tipo</span><div class="seg" role="group" aria-label="Tipo de perfil"><button type="button" class="on" aria-pressed="true">Pessoal</button><button type="button">Empresarial</button></div></div>
<div class="it"><span class="k">Moeda</span><span>BRL ›</span></div>
</div>
<h2 class="sec">Primeira conta</h2>
<div class="list">
<label class="it"><span class="k">Nome</span><input type="text" placeholder="Ex.: Nubank" maxlength="45"></label>
<label class="it"><span class="k">Saldo inicial</span><input type="text" placeholder="R$ 0,00" inputmode="decimal"></label>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="MobileInicio.dc.html" class="bp">Criar e começar</a>
<a href="MobileParear.dc.html" class="bs">Entrar num grupo existente</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const dark = s.dark ?? (this.props.dark ?? false);
return {
themeClass: dark ? 'dark' : 'light',
themeLabel: dark ? 'Usar tema claro' : 'Usar tema escuro',
toggleTheme: () => this.setState({ dark: !dark })
};
}
}
</script>
</body>
</html>
