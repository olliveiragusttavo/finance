<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editar anotação — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.light{--bg:#F4F5F2;--surface:#FFFFFF;--line:#DDE1DC;--ink:#1B1F1D;--muted:#5A625E;--accent:#1F5F8B;--on-accent:#FFFFFF;--danger:#9B2C1F}
.dark{--bg:#111413;--surface:#1A1E1C;--line:#2E3431;--ink:#E7EAE7;--muted:#9AA29E;--accent:#6AAAD8;--on-accent:#0B1A24;--danger:#F08A7A}
a{color:var(--accent);text-decoration:none}
button,textarea{font:inherit;color:inherit}button{cursor:pointer}
.ph{width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--surface);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 8px 8px 8px;min-height:60px;box-sizing:border-box;border-bottom:1px solid var(--line)}
.ed{flex-grow:1;border:0;outline:0;background:none;padding:16px 20px;font-size:17px;line-height:1.6;resize:none}
.sm{font-size:12px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 20px;border-top:1px solid var(--line)}
</style>
</helmet>
<div class="ph {{themeClass}}">
<header class="hdr">
<a href="MobileAnotacoes.dc.html" style="padding: 12px; font-size: 15px">‹ Anotações</a>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
<a href="MobileAnotacoes.dc.html" style="padding: 12px; font-size: 15px; font-weight: 600">Salvar</a>
</div>
</header>
<label style="display: contents"><span style="position: absolute; left: -9999px">Texto da anotação</span><textarea class="ed">IPTU 2027
Cota única com desconto vence em fevereiro. Separar o valor da reserva em janeiro.

Valor: R$ [valor]</textarea></label>
<div class="foot"><span class="sm">A primeira linha vira o título</span><button type="button" style="border: 0; background: none; color: var(--danger); font-size: 15px; padding: 10px">Excluir</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const dark = s.dark ?? (this.props.dark ?? true);
return {
themeClass: dark ? 'dark' : 'light',
themeLabel: dark ? 'Usar tema claro' : 'Usar tema escuro',
toggleTheme: () => this.setState({ dark: !dark })
};
}
}
</script>
</body>
</html>
