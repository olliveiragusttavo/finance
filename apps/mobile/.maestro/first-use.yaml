# Primeiro uso (mobile-mvp-plan, Fase 7): do banco vazio ao Início, pelo formulário, com o APK
# de release. Prova no aparelho o que o Jest prova no Node: o `onboarding.start` grava pelo
# `expo-sqlite` e o shell abre no perfil criado.
appId: br.com.finance.app
---
- clearState
- launchApp
- extendedWaitUntil:
    visible: "Vamos começar"
    timeout: 30000
- tapOn: "Nome do perfil"
- inputText: "Pessoal"
- tapOn: "Nome da conta"
- inputText: "Nubank"
- hideKeyboard
- tapOn: "Criar e começar"
- extendedWaitUntil:
    visible: "Perfil: Pessoal · Pessoal. Trocar perfil"
    timeout: 15000
- assertVisible: "Mês de referência"
